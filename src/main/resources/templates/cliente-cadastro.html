<!DOCTYPE html>
<html lang="pt-br">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Cadastro de Cliente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link href="css/styles.css" rel="stylesheet">

    </head>

    <body>

        <div class="container py-5">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-0">Cadastro de Cliente</h2>

                </div>

                <div class="card-body">

                    <form id="formCliente">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input
                                    type="text"
                                    id="nome"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Telefone</label>

                                <input
                                    type="text"
                                    id="telefone"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-8 mb-3">

                                <label>Logradouro</label>

                                <input
                                    type="text"
                                    id="logradouro"
                                    class="form-control">

                            </div>

                            <div class="col-md-4 mb-3">

                                <label>Número</label>

                                <input
                                    type="text"
                                    id="numero"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Bairro</label>

                                <input
                                    type="text"
                                    id="bairro"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Cidade</label>

                                <input
                                    type="text"
                                    id="cidade"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Estado</label>

                                <input
                                    type="text"
                                    id="estado"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>CEP</label>

                                <input
                                    type="text"
                                    id="cep"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="d-flex gap-3 mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Cadastrar

                            </button>

                            <button
                                type="reset"
                                class="btn btn-warning">

                                Limpar

                            </button>

                            <button
                                type="button"
                                onclick="voltar()"
                                class="btn btn-secondary">

                                Voltar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <script src="js/cliente-cadastro.js"></script>

    </body>
</html>
