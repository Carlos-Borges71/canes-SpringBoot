<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Cadastro de Cliente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" th:href="@{/css/styles.css}">

    </head>

    <body>

        <div class="container py-5">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-0">Cadastro de Cliente</h2>

                </div>

                <div class="card-body">

                    <form th:action="@{/clientes/salvar}" method="post">

                        <div class="row">

                            <input type="hidden"
                                   name="id"
                                   th:value="${cliente != null ? cliente.id : ''}">

                            <div class="col-md-6 mb-3">

                                <label>Nome</label>

                                <input
                                    type="text"
                                    name="nome"
                                    id="nome"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"                                    
                                    th:value="${cliente != null ? cliente.nome : ''}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Telefone</label>

                                <input
                                    type="text"
                                    name="telefone"
                                    id="telefone"
                                    class="form-control"
                                    oninput="mascararTelefone(this)"
                                    th:value="${cliente != null ? cliente.telefone.numero : ''}">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-8 mb-3">

                                <label>Logradouro</label>

                                <input
                                    type="text"
                                    name="logradouro"
                                    id="logradouro"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${cliente != null ? cliente.endereco.logradouro : ''}">

                            </div>

                            <div class="col-md-4 mb-3">

                                <label>Número</label>

                                <input
                                    type="text"
                                    name="numero"
                                    id="numero"
                                    class="form-control"
                                    th:value="${cliente != null ? cliente.endereco.numero : ''}">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Bairro</label>

                                <input
                                    type="text"
                                    name="bairro"
                                    id="bairro"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${cliente != null ? cliente.endereco.bairro : ''}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Cidade</label>

                                <input
                                    type="text"
                                    name="cidade"
                                    id="cidade"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${cliente != null ? cliente.endereco.cidade : ''}">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Estado</label>

                                <input
                                    type="text"
                                    id="estado"
                                    name="estado"
                                    class="form-control"
                                    oninput="validarEstado(this)"
                                    th:value="${cliente != null ? cliente.endereco.estado : ''}">
                                <div class="invalid-feedback">
                                    Informe uma sigla de estado válida (RJ, SP, MG...)
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">

                                <label>CEP</label>

                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    class="form-control"
                                    maxlength="9"
                                    oninput="mascararCep(this)"
                                    th:value="${cliente != null ? cliente.endereco.cep : ''}">

                            </div>

                        </div>

                        <div class="d-flex gap-3 mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Salvar

                            </button>

                            <button
                                type="reset"
                                class="btn btn-warning">

                                Limpar

                            </button>

                            <button
                                type="button"
                                onclick="voltar()"
                                class="btn btn-secondary">

                                Voltar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

        <script th:src="@{/js/cliente-cadastro.js}"></script>
        <script th:src="@{/js/mascaras.js}"></script>
        <script th:src="@{/js/toast.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="toastMensagem"
             class="toast text-bg-danger border-0"
             role="alert">

            <div class="d-flex">

                <div class="toast-body"
                     id="toastTexto">
                </div>

                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>
</html>
