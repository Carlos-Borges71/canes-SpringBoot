<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>

        <link rel="stylesheet" href="/css/styles.css">

       
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>

        <div class="login-container">

            <div class="logo-area">

                <img src="/img/canes.png"
                     class="logo"
                     width="280">

            </div>

            <div class="login-area">

                <div class="login-card">

                    <h2>
                        <i class="bi bi-person-circle text-azul"></i>
                        Login
                    </h2>

                    <form id="formLogin">

                        <div class="form-group">
                            <label>Login</label>

                            <input
                                type="text"
                                id="login">
                        </div>

                        <div class="form-group">
                            <label>Senha</label>

                            <input
                                type="password"
                                id="senha">
                        </div>

                        <button
                            type="submit"
                            class="btn-primary">

                            Entrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <script src="/js/login.js"></script>

    </body>
</html>
