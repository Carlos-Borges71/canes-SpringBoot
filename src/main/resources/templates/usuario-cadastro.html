<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"> 

    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Usuário</title>


        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body>
        <div class="container py-5">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-0">Cadastro de Usuário</h2>

                </div>

                <div class="card-body">

                    <form th:action="@{/usuarios/salvar}" method="post">


                        <input type="hidden"
                               name="id"
                               th:value="${usuario != null ? usuario.id : ''}">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nome</label>

                                <input
                                    type="text"
                                    name="nome"
                                    id="nome"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${usuario != null ? usuario.nome : ''}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Telefone</label>

                                <input
                                    type="text"
                                    name="telefone"
                                    id="telefone"
                                    class="form-control"
                                    oninput="mascararTelefone(this)"
                                    th:value="${usuario != null ? usuario.telefone.numero : ''}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Setor</label>

                                <select
                                    id="setor"
                                    name="setor"
                                    class="form-select">

                                    <option value="">Selecione</option>

                                    <option value="VENDA"
                                            th:selected="${usuario != null && usuario.setor == 'VENDA'}">
                                        VENDA
                                    </option>

                                    <option value="ADMINISTRATIVO"
                                            th:selected="${usuario != null && usuario.setor == 'ADMINISTRATIVO'}">
                                        ADMINISTRATIVO
                                    </option>

                                    <option value="GERÊNCIA"
                                            th:selected="${usuario != null && usuario.setor == 'GERENCIA'}">
                                        GERÊNCIA
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Login</label>

                                <input
                                    type="text"
                                    name="login"
                                    id="login"
                                    class="form-control"
                                    th:value="${usuario != null ? usuario.login : ''}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Senha</label>

                                <input
                                    type="password"
                                    name="senha"
                                    id="senha"
                                    class="form-control"
                                    th:value="${usuario != null ? usuario.senha : ''}">
                            </div>

                        </div>

                        <hr>

                        <h4>
                            <i class="bi bi-geo-alt-fill"></i>
                            Endereço
                        </h4>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Logradouro</label>

                                <input
                                    type="text"
                                    name="logradouro"
                                    id="logradouro"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${usuario != null ? usuario.endereco.logradouro : ''}">
                            </div>

                            <div class="col-md-2 mb-3">
                                <label class="form-label">Número</label>

                                <input
                                    type="text"
                                    name="numero"
                                    id="numero"
                                    class="form-control"
                                    th:value="${usuario != null ? usuario.endereco.numero : ''}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Bairro</label>

                                <input
                                    type="text"
                                    name="bairro"
                                    id="bairro"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${usuario != null ? usuario.endereco.bairro : ''}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Cidade</label>

                                <input
                                    type="text"
                                    name="cidade"
                                    id="cidade"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"
                                    th:value="${usuario != null ? usuario.endereco.cidade : ''}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Estado</label>

                                <input
                                    type="text"
                                    id="estado"
                                    name="estado"
                                    class="form-control"
                                    oninput="validarEstado(this)"
                                    th:value="${usuario != null ? usuario.endereco.estado : ''}">

                                <div class="invalid-feedback">
                                    Informe uma sigla de estado válida (RJ, SP, MG...)
                                </div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">CEP</label>

                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    class="form-control"
                                    maxlength="9"
                                    oninput="mascararCep(this)"
                                    th:value="${usuario != null ? usuario.endereco.cep : ''}">
                            </div>

                        </div>

                        <div class="d-flex gap-3 mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                salvar

                            </button>

                            <button
                                type="reset"
                                class="btn btn-warning">

                                Limpar

                            </button>

                            <button
                                type="button"
                                onclick="voltar()"
                                class="btn btn-secondary">

                                Voltar

                            </button>

                        </div>


                    </form>
                </div>
            </div>
        </div>


        <script th:src="@{/js/usuario-cadastro.js}"></script>
        <script th:src="@{/js/mascaras.js}"></script>

        <script th:src="@{/js/toast.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    </body>

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="toastMensagem"
             class="toast text-bg-danger border-0"
             role="alert">

            <div class="d-flex">

                <div class="toast-body"
                     id="toastTexto">
                </div>

                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>
</html>
