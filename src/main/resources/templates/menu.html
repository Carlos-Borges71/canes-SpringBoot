<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Principal</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>

        <div class="container py-5">

            <!-- Cabeçalho -->

            <div class="card shadow border-0 mb-5">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="mb-1">Sistema Canes</h2>

                        <span id="usuarioLogado">
                            <strong
                                th:text="${usuarioLogado.nome}">
                            </strong>
                        </span>

                        <br>

                        <small id="setor">
                            <strong
                                th:text="${usuarioLogado.setor}">
                            </strong>
                        </small>
                    </div>

                    <img src="/img/canes.png"
                         width="120">
                </div>

            </div>

            <!-- Cards -->

            <div class="row g-4">

                <!-- Usuário -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-people-fill display-3 text-primary"></i>

                            <h4 class="mt-3">
                                Usuários
                            </h4>

                            <p>
                                Cadastro e gerenciamento de usuários.
                            </p>

                            <a href="/usuarios"
                               class="btn btn-primary">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

                <!-- Clientes -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-person-vcard-fill display-3 text-success"></i>

                            <h4 class="mt-3">
                                Clientes
                            </h4>

                            <p>
                                Cadastro e consulta de clientes.
                            </p>

                            <a href="/clientes"
                               class="btn btn-success">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

                <!-- Produtos -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-box-seam-fill display-3 text-warning"></i>

                            <h4 class="mt-3">
                                Produtos
                            </h4>

                            <p>
                                Controle de estoque e produtos.
                            </p>

                            <a href="/produtos"
                               class="btn btn-warning">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Botão Sair -->

            <div class="text-center mt-5">

                <button
                    type="button"
                    class="btn btn-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#modalLogout">

                    <i class="bi bi-box-arrow-right"></i>
                    Sair

                </button>

            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
       
        <div class="modal fade"
             id="modalLogout"
             tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Confirmar Saída
                        </h5>

                    </div>

                    <div class="modal-body">

                        Deseja realmente sair do sistema?

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <a id="btnConfirmarLogout"
                           href="/logout"
                           class="btn btn-danger">

                            Sair

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </body>    
</html>
