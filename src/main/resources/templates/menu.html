<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Principal</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="/css/styles.css">
    </head>
    <body>

        <div class="container py-5">

            <!-- Cabeçalho -->

            <div class="card shadow border-0 mb-5">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h2 class="mb-1">Sistema Canes</h2>

                        <span id="usuarioLogado">
                            Carlos Borges
                        </span>

                        <br>

                        <small id="setor">
                            Administrativo
                        </small>
                    </div>

                    <img src="/img/canes.png"
                         width="120">
                </div>

            </div>

            <!-- Cards -->

            <div class="row g-4">

                <!-- Usuário -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-people-fill display-3 text-primary"></i>

                            <h4 class="mt-3">
                                Usuários
                            </h4>

                            <p>
                                Cadastro e gerenciamento de usuários.
                            </p>

                            <a href="/usuarios"
                               class="btn btn-primary">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

                <!-- Clientes -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-person-vcard-fill display-3 text-success"></i>

                            <h4 class="mt-3">
                                Clientes
                            </h4>

                            <p>
                                Cadastro e consulta de clientes.
                            </p>

                            <a href="/clientes"
                               class="btn btn-success">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

                <!-- Produtos -->

                <div class="col-md-4">

                    <div class="card h-100 shadow-sm border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-box-seam-fill display-3 text-warning"></i>

                            <h4 class="mt-3">
                                Produtos
                            </h4>

                            <p>
                                Controle de estoque e produtos.
                            </p>

                            <a href="/produtos"
                               class="btn btn-warning">
                                Acessar
                            </a>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Botão Sair -->

            <div class="text-center mt-5">

                <button
                    class="btn btn-danger btn-lg"
                    onclick="logout()">

                    <i class="bi bi-box-arrow-right"></i>
                    Sair

                </button>

            </div>

        </div>

        <script src="/js/menu.js"></script>

    </body>
</html>
