<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Cadastro de Produto</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" th:href="@{/css/styles.css}">

    </head>

    <body>

        <div class="container py-5">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h2>Cadastro de Produto</h2>

                </div>

                <div class="card-body">

                    <form th:action="@{/produtos/salvar}" method="post">

                        <div class="row">
                            
                             <input type="hidden"
                                   name="id"
                                   th:value="${produto != null ? produto.id : ''}">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Produto
                                </label>

                                <input
                                    type="text"
                                    name="nome"
                                    id="nome"
                                    class="form-control"
                                    oninput="formatarLowerCase(this)"                                    
                                    th:value="${produto != null ? produto.nome : ''}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Código
                                </label>

                                <input
                                    type="text"
                                    name="codigo"
                                    id="codigo"
                                    class="form-control"
                                    oninput="apenasNumeros(this)"                                    
                                    th:value="${produto != null ? produto.codigo : ''}">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Quantidade
                                </label>

                                <input
                                    type="text"
                                    name="estoque"
                                    id="estoque"
                                    class="form-control"
                                    oninput="apenasNumeros(this)"                                    
                                    th:value="${produto != null ? produto.estoque : ''}">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Valor (R$)
                                </label>

                                <input
                                    type="text"
                                    name="valor"
                                    id="valor"
                                    class="form-control"
                                    oninput="mascararMoeda(this)"                                    
                                    th:value="${produto != null ? produto.valor : ''}">

                            </div>

                        </div>

                        <div class="d-flex gap-3 mt-4">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Salvar

                            </button>

                            <button
                                type="reset"
                                class="btn btn-warning">

                                Limpar

                            </button>

                            <button
                                type="button"
                                onclick="voltar()"
                                class="btn btn-secondary">

                                Voltar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
        
        <script th:src="@{/js/toast.js}"></script>
        <script th:src="@{/js/produto-cadastro.js}"></script>
        <script th:src="@{/js/mascaras.js}"></script>
        <script th:src="@{/js/toast.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    
     <div class="toast-container position-fixed top-0 end-0 p-3">

        <div id="toastMensagem"
             class="toast text-bg-danger border-0"
             role="alert">

            <div class="d-flex">

                <div class="toast-body"
                     id="toastTexto">
                </div>

                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>

            </div>

        </div>

    </div>
</html>
