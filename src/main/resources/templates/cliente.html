<!DOCTYPE html >
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"> 
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Clientes</title>

        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    </head>

    <body>

        <header>

            <div class="logo">
                CANES FASHION
            </div>

            <div class="usuario">
                <strong
                    th:text="${usuarioLogado.nome}">
                </strong>
            </div>

        </header>

        <main>

            <section class="titulo">

                <h1>Cliente</h1>

                <div class="acoes">
                    <button class="btn-novo"
                            onclick="novoCliente()">
                        <i class="bi bi-plus-circle"></i>
                        Novo Cliente
                    </button>

                    <button class="btn-voltar"
                            onclick="voltar()">
                        <i class="bi bi-arrow-left"></i>

                        Voltar
                    </button>
                </div>

            </section>

            <section class="pesquisa">

                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        id="txtPesquisa"
                        placeholder="Pesquisar">

                </div>

            </section>

            <section class="tabela">

                <table id="tblClientes">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>Estado</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="cliente : ${clientes}">

                            <td th:text="${cliente.id}"></td>

                            <td th:text="${cliente.nome}"></td>

                            <td th:text="${cliente.telefone.numero}"></td>

                            <td th:text="${cliente.endereco.cidade}"></td>

                            <td th:text="${cliente.endereco.estado}"></td>


                            <td>

                                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                                   class="btn-editar"
                                   th:classappend="${usuarioLogado.setor == 'VENDA' || usuarioLogado.setor == 'ADMINISTRATIVO'} ? ' disabled' : ''">

                                    <i class="bi bi-pencil"></i>

                                </a>

                                <a class="btn-excluir"
                                   th:classappend="${usuarioLogado.setor == 'VENDA'|| usuarioLogado.setor == 'ADMINISTRATIVO'} ? ' disabled' : ''"
                                   data-bs-toggle="modal"
                                   data-bs-target="#modalExcluir"
                                   th:data-id="${cliente.id}"
                                   th:data-nome="${cliente.nome}"
                                   onclick="prepararExclusao(this)">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </td>

                        </tr>                   

                    </tbody>
                </table>

                <!-- Modal -->
                <div class="modal fade"
                     id="modalExcluir"
                     tabindex="-1">

                    <div class="modal-dialog">

                        <div class="modal-content">

                            <div class="modal-header bg-danger text-white">

                                <h5 class="modal-title">
                                    Confirmar Exclusão
                                </h5>

                                <button type="button"
                                        class="btn-close btn-close-white"
                                        data-bs-dismiss="modal">
                                </button>

                            </div>

                            <div class="modal-body">

                                Deseja realmente excluir o cliente
                                <strong id="nomeCliente"></strong>?

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">

                                    Cancelar

                                </button>

                                <a id="btnConfirmarExcluir"
                                   class="btn btn-danger">

                                    Excluir

                                </a>

                            </div>

                        </div>

                    </div>

                </div>


            </section>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/cliente.js"></script>

    </body>
</html>
