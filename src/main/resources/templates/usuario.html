<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"> 
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Usuários</title>

        <link rel="stylesheet" href="css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    </head>

    <body>

        <header>

            <div class="logo">
                CANES FASHION
            </div>

            <div class="usuario">
                Carlos Borges
            </div>

        </header>

        <main>

            <section class="titulo">

                <h1>Usuário</h1>

                <div class="acoes">
                    <button class="btn-novo"
                            onclick="novoUsuario()">
                        <i class="bi bi-plus-circle"></i>
                        Novo usuário
                    </button>

                    <button class="btn-voltar"
                            onclick="voltar()">
                        <i class="bi bi-arrow-left"></i>
                        Voltar
                    </button>
                </div>

            </section>

            <section class="pesquisa">

                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        id="txtPesquisa"
                        placeholder="Pesquisar">

                </div>

            </section>

            <section class="tabela">

                <table id="tblUsuarios">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Nome</th>
                            <th>Setor</th>
                            <th>Login</th>
                            <th>Telefone</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="usuario : ${usuarios}">

                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.nome}"></td>
                            <td th:text="${usuario.setor}"></td>
                            <td th:text="${usuario.login}"></td>
                            <td th:text="${usuario.telefone.numero}"></td>

                            <td>

                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                   class="btn-editar">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <a class="btn-excluir"
                                   data-bs-toggle="modal"
                                   data-bs-target="#modalExcluir"
                                   th:data-id="${usuario.id}"
                                   th:data-nome="${usuario.nome}"
                                   onclick="prepararExclusao(this)">

                                    <i class="bi bi-trash"></i>
                                </a>

                            </td>

                        </tr>                       

                    </tbody>

                </table>
                <!-- Modal -->
                <div class="modal fade"
                     id="modalExcluir"
                     tabindex="-1">

                    <div class="modal-dialog">

                        <div class="modal-content">

                            <div class="modal-header bg-danger text-white">

                                <h5 class="modal-title">
                                    Confirmar Exclusão
                                </h5>

                                <button type="button"
                                        class="btn-close btn-close-white"
                                        data-bs-dismiss="modal">
                                </button>

                            </div>

                            <div class="modal-body">

                                Deseja realmente excluir o usuário
                                <strong id="nomeCliente"></strong>?

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">

                                    Cancelar

                                </button>

                                <a id="btnConfirmarExcluir"
                                   class="btn btn-danger">

                                    Excluir

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/usuario.js"></script>

    </body>
</html>
